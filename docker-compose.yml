# Perfiles (COMPOSE_PROFILES en .env):
#   db   → levanta su propio Postgres+PostGIS (desarrollo local). En el VPS se omite y la API usa la base
#          existente indicada en API_DATABASE_URL.
#   full → API y web en contenedores (VPS).
# Puertos del host (configurables en .env): web 4710 · API 4711 · MinIO 4712 · consola MinIO 4713 (127.0.0.1)
# · Postgres propio 4714 (127.0.0.1). No chocan con las demás aplicaciones del VPS.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: toce-postgres
    restart: unless-stopped
    profiles: ["db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-toce}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-4714}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toce} -d ${POSTGRES_DB:-toce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO dejó de publicar imágenes oficiales (2025). Usamos el build comunitario de Pigsty
  # (mismo código fuente de MinIO, con consola web). Versión fijada a propósito.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: toce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MINIO_HOST_PORT:-4712}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-4713}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: toce-api
    restart: unless-stopped
    profiles: ["full"]
    env_file: .env
    environment:
      # Base existente (VPS) o la del perfil "db".
      DATABASE_URL: ${API_DATABASE_URL:-postgres://${POSTGRES_USER:-toce}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-toce}}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      API_PORT: "4000"
    ports:
      - "${API_HOST_PORT:-4711}:4000"
    # Permite llegar a una base que corre en el mismo VPS (fuera de este compose) como host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL}
    container_name: toce-web
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${WEB_HOST_PORT:-4710}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
