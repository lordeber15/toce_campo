# Perfiles (COMPOSE_PROFILES en .env):
#   db   → levanta su propio Postgres+PostGIS (desarrollo local). En el VPS se omite y la API usa la base
#          existente indicada en DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME.
#   full → API y web en contenedores (VPS).
# Puertos del host (configurables en .env): web 4710 · API 4711 · MinIO 4712 · consola MinIO 4713 (127.0.0.1)
# · Postgres propio en DB_PORT (127.0.0.1, solo perfil db). No chocan con las demás aplicaciones del VPS.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: toce-postgres
    restart: unless-stopped
    profiles: ["db"]
    environment:
      # Se crea con las mismas variables que usa la API.
      POSTGRES_USER: ${DB_USER:-toce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-toce}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-toce} -d ${DB_NAME:-toce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO dejó de publicar imágenes oficiales (2025). Usamos el build comunitario de Pigsty
  # (mismo código fuente de MinIO, con consola web). Versión fijada a propósito.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: toce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Sin esto, un navegador que abre la raíz se redirige a la consola (:9001), que no es pública.
      MINIO_BROWSER_REDIRECT: "off"
      TZ: ${TZ}
    ports:
      - "${MINIO_HOST_PORT:-4712}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-4713}:9001"
    volumes:
      - minio_data:/data
    networks: [default, proxy]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: toce-api
    restart: unless-stopped
    profiles: ["full"]
    env_file: .env
    environment:
      # La base se toma de DB_* del .env (en el VPS, DB_HOST=host.docker.internal).
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      API_PORT: "4000"
    ports:
      - "${API_HOST_PORT:-4711}:4000"
    # Permite llegar a una base que corre en el mismo VPS (fuera de este compose) como host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, proxy]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL}
    container_name: toce-web
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "${WEB_HOST_PORT:-4710}:80"
    networks: [default, proxy]
    depends_on:
      - api

# Red del proxy (Nginx Proxy Manager) para llegar a toce-web, toce-api y toce-minio por nombre.
# En el VPS: PROXY_NETWORK=nginx_default. En local se crea sola si no existe (toce_proxy).
networks:
  proxy:
    name: ${PROXY_NETWORK:-toce_proxy}
    external: ${PROXY_NETWORK_EXTERNAL:-false}

volumes:
  postgres_data:
  minio_data:
